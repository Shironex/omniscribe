name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [master, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master, 'v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app-code: ${{ steps.filter.outputs.root-config == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.plugin-api == 'true' || steps.filter.outputs.plugins == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.mcp-server == 'true' }}
      docs-relevant: ${{ steps.filter.outputs.root-config == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.plugin-api == 'true' || steps.filter.outputs.docs == 'true' }}
      integration-relevant: ${{ steps.filter.outputs.root-config == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.plugin-api == 'true' || steps.filter.outputs.plugins == 'true' || steps.filter.outputs.desktop == 'true' }}
      e2e-relevant: ${{ steps.filter.outputs.root-config == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.plugin-api == 'true' || steps.filter.outputs.plugins == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.web == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            root-config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.prettierignore'
            ci:
              - '.github/**'
            shared:
              - 'packages/shared/**'
            plugin-api:
              - 'packages/plugin-api/**'
            plugins:
              - 'packages/plugins/**'
            desktop:
              - 'apps/desktop/**'
            web:
              - 'apps/web/**'
            mcp-server:
              - 'apps/mcp-server/**'
            docs:
              - 'apps/docs/**'

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.app-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.app-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.app-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run tests
        run: pnpm test

  integration:
    name: Integration Tests
    needs: [changes]
    if: needs.changes.outputs.integration-relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build packages
        run: pnpm build:packages

      - name: Run integration tests
        run: pnpm --filter @omniscribe/desktop test:integration

  docs:
    name: Docs Build
    needs: [changes]
    if: needs.changes.outputs.docs-relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build docs
        run: pnpm docs:build

  build:
    name: Build
    needs: [changes, format, lint, typecheck, test, integration]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.changes.outputs.app-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build all packages
        run: pnpm build

  e2e:
    name: E2E Tests
    needs: [changes, build]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.changes.outputs.e2e-relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build all packages
        run: pnpm build

      - name: Install Electron system dependencies
        run: npx playwright install-deps
        working-directory: apps/desktop

      - name: Run E2E tests
        run: xvfb-run --auto-servernum -- pnpm --filter @omniscribe/desktop test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: apps/desktop/e2e/test-results/

  ci-result:
    name: CI Result
    if: always()
    needs: [format, lint, typecheck, test, integration, docs, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI outcome
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
